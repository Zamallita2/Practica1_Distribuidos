<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS - Dashboard de Monitoreo de Storage Cluster</title>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Librería Chart.js para el gráfico circular -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <!-- Header / Resumen Global -->
    <header>
        <div class="header-left">
            <div class="logo-cns">C<br>NS</div>
            <div class="header-info">
                <h1>Monitor nacional de almacenamiento</h1>
                <p>
                    <strong>Total:</strong> <span id="hdr-total">0 TB</span> &nbsp;-&nbsp; 
                    <strong>Usado:</strong> <span id="hdr-used">0 GB</span> &nbsp;-&nbsp; 
                    <strong>Libre:</strong> <span id="hdr-free">0 GB</span>
                </p>
                <p>Reportaron <span id="hdr-reporting">0 de 9</span></p>
            </div>
        </div>
        <div class="header-right">
            <div>
                18 Discos<br>
                <span id="hdr-pct" style="font-weight: 400;">0 %</span>
            </div>
            <div class="chart-container">
                <canvas id="globalChart"></canvas>
            </div>
        </div>
    </header>

    <!-- Contenedor del Grid para los Servidores -->
    <div class="servers-grid" id="servers-container">
        <!-- Las tarjetas de los servidores se inyectarán aquí dinámicamente vía JS -->
    </div>

    <!-- Script de Lógica del Dashboard -->
    <script src="{{ url_for('static', filename='js/monitor.js') }}"></script>
</body>
</html>
