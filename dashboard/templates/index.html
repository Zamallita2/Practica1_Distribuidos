<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS - Dashboard de Monitoreo de Storage Cluster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-card h3 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .kpi-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .server-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-activo {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-no-reporta {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.5s ease;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏥 CNS Storage Cluster — Monitoreo Centralizado</h1>
        <div>Auto-Refresh: <span id="refresh-timer" style="color: var(--accent-blue);">3s</span></div>
    </header>

    <!-- KPIs Globales del Cluster -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <h3>Capacidad Total Cluster</h3>
            <div class="value" id="kpi-total">0.00 GB</div>
        </div>
        <div class="kpi-card">
            <h3>Espacio Utilizado</h3>
            <div class="value" id="kpi-used" style="color: var(--accent-blue);">0.00 GB</div>
        </div>
        <div class="kpi-card">
            <h3>Espacio Libre Global</h3>
            <div class="value" id="kpi-free" style="color: var(--accent-green);">0.00 GB</div>
        </div>
        <div class="kpi-card">
            <h3>Utilización Cluster</h3>
            <div class="value" id="kpi-utilization">0%</div>
        </div>
        <div class="kpi-card">
            <h3>Nodos Activos</h3>
            <div class="value" id="kpi-nodes">0 / 9</div>
        </div>
    </div>

    <h2 style="margin-bottom: 16px; font-size: 1.2rem; color: var(--text-secondary);">Servidores Regionales (9 Nodos)</h2>

    <!-- Listado de los 9 Servidores Regionales -->
    <div class="servers-grid" id="servers-container">
        <!-- Renderizado dinámico JS -->
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                // Actualizar KPIs Globales
                document.getElementById('kpi-total').innerText = data.cluster.total_cluster_gb + ' GB';
                document.getElementById('kpi-used').innerText = data.cluster.used_cluster_gb + ' GB';
                document.getElementById('kpi-free').innerText = data.cluster.free_cluster_gb + ' GB';
                document.getElementById('kpi-utilization').innerText = data.cluster.pct_utilization + '%';
                document.getElementById('kpi-nodes').innerText = `${data.cluster.active_nodes} / 9`;

                // Actualizar Tarjetas de Servidores
                const container = document.getElementById('servers-container');
                container.innerHTML = '';

                data.servers.forEach(srv => {
                    const total = srv.total_gb || 1;
                    const used = srv.used_gb || 0;
                    const pct = Math.round((used / total) * 100);
                    const statusClass = srv.status === 'Activo' ? 'status-activo' : 'status-no-reporta';

                    const card = `
                        <div class="server-card">
                            <div class="server-header">
                                <h3>${srv.client_id}</h3>
                                <span class="status-badge ${statusClass}">${srv.status}</span>
                            </div>
                            <div class="metric-row">
                                <span>Disco: ${srv.disk_name || 'N/A'} (${srv.disk_type || 'SSD/HDD'})</span>
                                <span>IOPS: ${srv.iops || 0}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${pct}%;"></div>
                            </div>
                            <div class="metric-row">
                                <span>Usado: ${used} GB / ${srv.total_gb || 0} GB</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="metric-row" style="margin-top: 10px; font-size: 0.75rem;">
                                <span>Último reporte: ${srv.last_seen || 'Sin datos'}</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                console.error("Error fetching dashboard data:", err);
            }
        }

        // Auto-refresh cada 3 segundos (Lucas)
        setInterval(fetchDashboardData, 3000);
        fetchDashboardData();
    </script>
</body>
</html>
